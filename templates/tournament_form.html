{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Turnier anlegen</h1>
    </div>

</div>


<div class="form-card">

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="post">


        <label for="series_id">
            Turnierserie
        </label>

        <select
    	    id="series_id"
    	    name="series_id"
	>

    	    <option value="">
        	Keine Turnierserie
    	    </option>

    	{% for series in series_list %}

    	   <option
        	value="{{ series.id }}"
        	{% if selected_series_id|string == series.id|string %}
            	selected
        	{% endif %}
    	    >

        	{{ series.name }}

    	    </option>

    	    {% endfor %}

	</select>


        <label for="name">
            Turniername
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="z. B. Friday FNM Draft"
            required
        >


        <label for="format">
            Format
        </label>

        <select
            id="format"
            name="format"
            required
        >

            <option value="">
                Bitte auswählen
            </option>

            <option value="Draft">
                Draft
            </option>

            <option value="Sealed">
                Sealed
            </option>

            <option value="Constructed">
                Constructed
            </option>

        </select>


        <label for="date">
            Datum
        </label>

        <input
            type="date"
            id="date"
            name="date"
            required
        >


        <label for="rounds">
            Anzahl Runden
        </label>

        <input
            type="number"
            id="rounds"
            name="rounds"
            value="3"
            min="1"
            required
        >


        <div class="checkbox-row">

            <input
                type="checkbox"
                id="counts_for_top8"
                name="counts_for_top8"
                checked
            >

            <label for="counts_for_top8">
                Zählt für die Top-8-Wertung
            </label>

        </div>


        <div class="checkbox-row">

            <input
                type="checkbox"
                id="historical"
                name="historical"
            >

            <label for="historical">
                Historisches Turnier
            </label>

        </div>


        <button
            type="submit"
            class="primary-button"
        >
            Turnier anlegen
        </button>

    </form>

</div>

{% endblock %}
